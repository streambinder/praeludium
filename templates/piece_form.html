{{define "content"}}
<div class="page-head">
<span class="overline">{{t "pieces.overline"}}</span>
<h1>{{t "piece.edit_title"}}</h1>
</div>
<section class="panel reveal">
<form method="post" action="/pieces/{{.Piece.ID}}/edit">
<div class="row">
<label>{{t "field.composer"}} <input type="text" name="composer" value="{{.Piece.Composer}}" required></label>
<label>{{t "field.work"}} <input type="text" name="work" value="{{.Piece.Work}}" required></label>
</div>
<div class="row">
<label>{{t "field.movement"}} <input type="text" name="movement" value="{{.Piece.Movement}}"></label>
<label>{{t "field.kind"}}
<select name="kind">
<option value="excerpt" {{if eq .Piece.Kind "excerpt"}}selected{{end}}>{{t "kind.excerpt_long"}}</option>
<option value="solo" {{if eq .Piece.Kind "solo"}}selected{{end}}>{{t "kind.solo_long"}}</option>
</select></label>
</div>
<label>{{t "field.difficulty"}} <input type="range" name="difficulty" min="1" max="5" step="1" value="{{if .Piece.Difficulty}}{{.Piece.Difficulty}}{{else}}3{{end}}" oninput="this.nextElementSibling.textContent=this.value"> <output>{{if .Piece.Difficulty}}{{.Piece.Difficulty}}{{else}}3{{end}}</output></label>
<label>{{t "field.target_bpm"}} <input type="number" name="target_bpm" min="20" max="400" value="{{if .Piece.TargetBPM.Valid}}{{.Piece.TargetBPM.Int64}}{{end}}"></label>
<fieldset><legend>{{t "nav.auditions"}}</legend>
{{range .Auditions}}{{$aid := .ID}}<div class="link-excerpt"><label class="check"><input type="checkbox" name="audition" value="{{.ID}}" {{if index $.Selected .ID}}checked{{end}}> {{.Name}}</label> <input type="text" name="excerpt-{{.ID}}" value="{{index $.Excerpt .ID}}" placeholder="{{t "field.excerpt_ph"}}">{{if index $.Rounds $aid}} <select name="round-{{$aid}}"><option value="">{{t "rounds.all"}}</option>{{range $rd := index $.Rounds $aid}}<option value="{{$rd.ID}}"{{if eq (index $.SelRound $aid) $rd.ID}} selected{{end}}>{{$rd.Name}}</option>{{end}}</select>{{end}}</div>{{end}}
</fieldset>
<div class="row btns">
<button type="submit">{{t "common.save"}}</button>
<a class="btn secondary" href="/pieces">{{t "common.cancel"}}</a>
</div>
</form>
</section>
{{end}}
