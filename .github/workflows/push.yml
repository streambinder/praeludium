---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  go:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go install mvdan.cc/gofumpt@v0.11.0
      - run: test -z "$(gofumpt -l .)"
      - run: go vet ./...
      - run: |
          echo Testing...
          go test -timeout 120s ./...
          echo Checking coverage...
          go test -timeout 120s -cover ./... | tee coverage.txt
          awk '/coverage:/ { pct = ""; for (i = 1; i <= NF; i++) if ($i == "coverage:") { pct = $(i+1); gsub(/%/, "", pct) } if (pct != "" && pct + 0 < 90) { print "coverage below 90%:", $0; bad = 1 } } END { exit bad }' coverage.txt
      - run: CGO_ENABLED=0 go build ./...
  docker:
    needs: [go]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/streambinder/praeludium:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
