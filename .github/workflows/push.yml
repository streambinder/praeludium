---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  lint:
    # super-linter ships no arm64 image; this job runs on amd64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/biome.json ./
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: master
          VALIDATE_ALL_CODEBASE: ${{ github.ref == 'refs/heads/master' }}
          # The file mode of the Go linter takes one directory: with
          # cmd/ and internal/ it cannot run. The go job runs
          # golangci-lint on the whole module instead.
          VALIDATE_GO: false
          # templates/ holds the app templates, not standalone documents.
          # The .specify/ subtrees and manifests are Spec Kit managed files:
          # the CLI tracks them by hash, so linting them fights every refresh.
          # .specify/memory/ stays linted: the constitution and the decision
          # register are authored content.
          FILTER_REGEX_EXCLUDE: "templates/.*|\\.specify/(commands|templates|scripts|workflows|integrations)/.*|\\.specify/[^/]+\\.json"
          SAVE_SUPER_LINTER_OUTPUT: false
          MULTI_STATUS: false
          LOG_LEVEL: WARN
  rust:
    needs: [lint]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --component rustfmt,clippy,llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: |
          echo Testing...
          cargo test --locked
          echo Checking coverage...
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --locked --fail-under-lines 80
      - run: cargo build --release --locked
  docker:
    needs: [rust]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: deploy
    needs: [docker]
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, lobster]
    environment: production
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///run/podman/podman.sock
    steps:
      - name: Back up, pull the image and restart the service
        run: |
          docker run --rm --privileged --pid=host \
            docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            nsenter -t 1 -m -u -i -n -p -- sh -euc '
              /etc/cron.daily/backup-praeludium
              podman pull ghcr.io/${{ github.repository }}:latest
              systemctl restart praeludium.service
            '
      - name: Check praeludium answers
        run: |
          docker run --rm --privileged --pid=host \
            docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            nsenter -t 1 -m -u -i -n -p -- sh -euc '
              for attempt in $(seq 1 30); do
                if curl -fsS -o /dev/null http://127.0.0.1:65530/diary; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
            '
