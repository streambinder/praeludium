---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  lint:
    # super-linter ships no arm64 image; this job runs on amd64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/biome.json ./
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: master
          VALIDATE_ALL_CODEBASE: ${{ github.ref == 'refs/heads/master' }}
          # The file mode of the Go linter takes one directory: with
          # cmd/ and internal/ it cannot run. The go job runs
          # golangci-lint on the whole module instead.
          VALIDATE_GO: false
          # templates/ holds Go templates, not standalone documents.
          FILTER_REGEX_EXCLUDE: "templates/.*"
          SAVE_SUPER_LINTER_OUTPUT: false
          MULTI_STATUS: false
          LOG_LEVEL: WARN
  go:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: true
      - run: go install mvdan.cc/gofumpt@v0.11.0
      - run: test -z "$(gofumpt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          only-new-issues: false
          args: --config=.github/linters/.golangci.yml ./...
      - run: |
          echo Testing...
          go test -timeout 120s ./...
          echo Checking coverage...
          go test -timeout 120s -cover ./... | tee coverage.txt
          awk '/coverage:/ { pct = ""; for (i = 1; i <= NF; i++) if ($i == "coverage:") { pct = $(i+1); gsub(/%/, "", pct) } if (pct != "" && pct + 0 < 90) { print "coverage below 90%:", $0; bad = 1 } } END { exit bad }' coverage.txt
      - run: CGO_ENABLED=0 go build ./...
  docker:
    needs: [go]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
