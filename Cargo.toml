[package]
name = "praeludium"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Opinionated daily practice diary for orchestral audition preparation"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
form_urlencoded = "=1.2.2"
minijinja = { version = "=3.0.0", features = ["json", "serde"] }
rand = "=0.10.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust-embed = "=8.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
rusqlite = "=0.40.2"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
lto = true
